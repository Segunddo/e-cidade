# Proxy reverso do strangler fig.
#
# Serve os DOIS runtimes sob uma ÚNICA origem (http://localhost:8090). É isso que
# torna a migração incremental utilizável na prática:
#
#   - A sessão do e-cidade é por janela (cookie ECIDADEWINDOW<nome>) e presa à origem.
#     Com o 5.6 em :8080 e o 8.5 em :8085 são origens distintas, e a janela aberta pelo
#     login não encontra a sessão do outro lado.
#   - O login roda no Laravel 5.4, que não funciona em PHP 8, então precisa continuar
#     no runtime antigo até a Fase 1/2 do roadmap.
#
# Sob uma origem só, o navegador manda os mesmos cookies para os dois runtimes, que
# compartilham a mesma sessão (volume ecidade_sessions) e o mesmo PostgreSQL.
#
# Para migrar mais um módulo, basta acrescentar o prefixo dele ao bloco do PHP 8.5.

# ---- FASE B: roteamento por LISTA, nao por prefixo ------------------------
# Os prefixos que restam (con, cai, cad, pro, pre, amb, prot, rec, dv) NAO sao
# exclusivos de Tributario: as mesmas letras servem Financeiro, Patrimonial, RH,
# Educacao e Saude. Medido tela a tela, 319 de 345 sao exclusivas da area e so 26
# sao compartilhadas -- entao da para rotear por lista exata, e e o que se faz aqui.
#
# 1) tira o prefixo de janela /w/<n>/ e fica so com o nome do arquivo;
# 2) o map exato (hash, O(1)) decide o upstream.
map $uri $ecidade_arquivo {
    default                              $uri;
    ~^(?:/w/[0-9]+)?/(?<arq>[^/]+)$      $arq;
}

map $ecidade_arquivo $ecidade_upstream {
    default php56;
    include /etc/nginx/faseb_map.conf;
}

# O cabecalho de diagnostico acompanha a decisao do map.
map $ecidade_upstream $ecidade_runtime {
    default "PHP-5.6 (referencia)";
    php85   "PHP-8.5 (migrado - Fase B)";
}

upstream php56 { server ecidade_php56:80; }
upstream php85 { server ecidade_php85:80; }

server {
    listen 80;
    server_name localhost;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    # $http_host preserva a PORTA; $host a descarta. O e-cidade monta URLs absolutas
    # a partir de HTTP_HOST (ver $DB_URL_ABS em libs/db_stdlib.php), então com $host
    # o CSS/JS/fontes eram pedidos em http://localhost/ (porta 80) e a tela vinha sem
    # estilo nenhum. Não trocar por $host.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;

    # ---- MÓDULOS MIGRADOS -> PHP 8.5 ---------------------------------------
    # Cada prefixo aqui é um módulo já portado. Acrescentar um prefixo a esta
    # linha É o avanço da migração.
    #
    #   cem  Cemitério  — piloto (187 arquivos, lint limpo em 5.6 e 8.5,
    #                     35 classes com estado idêntico nos dois runtimes)
    #   tra  —           — portado, porém órfão no menu; mantido por já estar pronto
    # O desktop v3 prefixa as URLs com o id da janela: /w/<n>/cem1_campas001.php
    # (ver ECIDADE_REQUEST_PATH). Sem aceitar esse prefixo, o roteamento nunca
    # dispara na navegação real — só em acesso direto ao arquivo.
    # `~*` = INSENSÍVEL A MAIÚSCULAS. O e-cidade tem arquivos com o prefixo
    # capitalizado (Cem1_legista001.php, Amb1_*, Cai1_*). Com `~` sensível a caso,
    # essas telas continuam silenciosamente no 5.6 mesmo com o módulo portado.
    #   cem   Cemitério  — piloto (187 arquivos)
    #   itbi? ITBI       — 192 arquivos; cobre os prefixos `itb` e `itbi`
    #   agua? Água       — 224 telas; cobre `agu1_`..`agu4_` e `agua_*.RPC.php`
    #   jur   Jurídico   — 145 telas; `[0-9]*` (nao `[0-9]?`) porque existe `jur01_`
    #   div   Dívida Ativa — 148 telas; 148/148 idênticas
    #   mar   Marcas e Sinais — 35 telas; 35/35 idênticas
    #   not   Notificações — 14 telas; 14/14 idênticas
    #   tra              — portado, porém órfão no menu
    # Área EDUCAÇÃO (prefixos exclusivos, portados inteiros):
    #   tre   Transporte Escolar — 19 telas; 19/19 idênticas
    #   esc rel sec  Secretaria Educação — 16 telas; 16/16 idênticas
    #   bib   Biblioteca — 98 telas; 95/98 idênticas (3 artefatos da bateria)
    #   mer   Alimentação Escolar — 187 telas; 187/187 (as 20 mat/pro do módulo vão pelo map)
    #   edu   por subprefixo, um lote por vez. `edu0` cobre edu02_/edu03_/edu04_ e
    #         `edu(?=_)` cobre edu_*.RPC.php -- sem a lookahead, `edu` sozinho casaria
    #         TODOS os edu<n>_ antes de serem portados.
    #         edu3 + variantes — 71 telas; edu2 — 259 telas; edu4 — 148 telas
    #         edu1 por FAIXA DE LETRA (733 telas, grande demais para um lote): a-c — 196; d-m — 205; n-p — 132; q-z — 200
    #         Com os 1.211 edu*_ portados, a regra voltou a ser um `edu` so no grupo.
    # Área RECURSOS HUMANOS (prefixos exclusivos, portados inteiros):
    #   rh    RH — 9 telas; 9/9 idênticas
    #   eso   eSocial — 85 telas (eso01_, eso02_, eso04_, eso_ inclusive); 85/85 idênticas
    #   rec   Recursos Humanos — 279 telas; 278/279 (1 laco eterno no 5.6, feof(false)). As 3 telas
    #         rec de Assistência Social vão junto, já portadas; a 1 de Tributário já estava no map
    #   pes   Pessoal — por subprefixo, um sublote por vez (1.155 telas): pes3+pes4 — 270 telas,
    #         270/270 (a que dependia do PHPExcel.phar passou depois de porta-lo);
    #         pes1 — 370 telas, 370/370. pes2 — 515 telas, 515/515.
    #         Com os 1.155 pes*_ portados, a regra virou um `pes` so no grupo.
    location ~* ^(?:/w/[0-9]+)?/(?:(?:cem|itbi?|agua?|jur|div|mar|not|fis|iss|dvr|arr|tri|inf|tra|tre|esc|rel|sec|bib|mer|edu|rh|eso|rec|pes|ac|aco|ouv|lic)[0-9]*_) {
        add_header X-Ecidade-Runtime "PHP-8.5 (migrado)" always;
        proxy_pass http://php85;
    }

    # ---- TUDO O MAIS -> PHP 5.6 (referência) -------------------------------
    # Inclui login.php, abrir.php e as rotas /v4/* do Laravel/Passport, que não
    # rodam em PHP 8 enquanto o framework não subir de versão.
    # O upstream vem do map da Fase B: php85 para as telas que o banco atribui a
    # Tributario, php56 para todo o resto -- login.php, abrir.php e as rotas /v4/*
    # do Laravel/Passport, que nao rodam em PHP 8 enquanto o framework nao subir.
    location / {
        add_header X-Ecidade-Runtime $ecidade_runtime always;
        proxy_pass http://$ecidade_upstream;
    }
}

[project]
name = "ecidade-mcp"
version = "0.1.0"
description = "Servidor MCP local (stdio) da migracao do e-Cidade: regras, padroes legados, validacao no Docker e coordenacao"
requires-python = ">=3.12"
# versoes fixas em requirements.txt (instalacao: .mcp/.venv/bin/pip install -r .mcp/requirements.txt)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

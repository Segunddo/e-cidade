; Paridade do php.ini do PHP 8.5 com a REFERENCIA PHP 7.4 (php.ini de producao do Ubuntu em
; /etc/php/7.4/apache2/php.ini, imagem docker/php74-apache), nas diretivas que mudam saida ou
; comportamento observavel. Entra por bind mount (regressao/lab/docker-compose.e74.yml) e e lido
; DEPOIS do zz-ecidade.ini da imagem (ordem alfabetica), entao vence. Assim a unica variavel entre
; :8074 e :8185 e a versao do PHP, nao a configuracao.
;
; Levantado com ini_get_all() nas duas imagens (Apache SAPI do 7.4 lido do php.ini, porque o CLI
; forca output_buffering/max_execution_time). NAO repetidas aqui: diretivas depreciadas no 8.4+
; (session.sid_length, session.sid_bits_per_character, assert.exception), que gerariam aviso no
; boot; extension_dir/include_path (caminhos da imagem); extensoes ausentes no 8.5 (xmlrpc, xsl,
; bz2, ftp, sockets, gettext, ...), que sao achado da migracao e nao configuracao.

; O 7.4 retem 4 KB antes de enviar; sem isso um espaco antes do <?php sai antes do cookie de sessao.
output_buffering = 4096

; Cabecalho Content-Type e codificacao padrao de htmlspecialchars/htmlentities.
default_charset = "UTF-8"

; Mascara de erros (E_ALL & ~E_DEPRECATED & ~E_STRICT): muda o que um set_error_handler recebe.
error_reporting = 22527
display_startup_errors = Off

; Limites: um relatorio que estoura no 7.4 tem de estourar igual no 8.5.
memory_limit = 128M
max_execution_time = 30
max_input_time = 60

; Superglobais ($_ENV vazio, $_REQUEST so com GET+POST) e cabecalho X-Powered-By.
variables_order = "GPCS"
request_order = "GP"
expose_php = Off

; Producao: assert() nao e compilado; excecoes sem argumentos no trace (paginas de erro do Laravel).
zend.assertions = -1
zend.exception_ignore_args = On

; O 7.4 (Debian) nao faz GC de sessao no request; com o diretorio de sessoes compartilhado, o GC do
; 8.5 apagaria sessoes da referencia.
session.gc_probability = 0
session.gc_divisor = 1000

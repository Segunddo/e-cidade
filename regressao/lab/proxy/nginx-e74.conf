# Proxy do ambiente e74 (regressao sobre a base PHP 7.4): os dois runtimes sob UMA origem
# (http://localhost:8190), como o docker/proxy/nginx.conf da branch antiga.
#
# Por padrao TUDO vai para a referencia PHP 7.4: na base 7.4 nenhum modulo foi migrado ainda, e o
# proxy e a entrada dos fluxos de navegador, cuja baseline precisa ser gravada contra a referencia.
# Para mandar uma tela ao PHP 8.5, acrescente uma linha `<arquivo.php> php85;` em map-e74.conf.
# O cabecalho X-Ecidade-Runtime diz qual runtime respondeu (os fluxos o registram como INFO).

map_hash_bucket_size 128;

# Tira o prefixo de janela /w/<n>/ do desktop v3 e fica so com o nome do arquivo.
map $uri $ecidade_arquivo {
    default                              $uri;
    ~^(?:/w/[0-9]+)?/(?<arq>[^/]+)$      $arq;
}

map $ecidade_arquivo $ecidade_upstream {
    default php74;
    include /etc/nginx/map-e74.conf;
}

map $ecidade_upstream $ecidade_runtime {
    default "PHP-7.4 (referencia)";
    php85   "PHP-8.5 (migrado)";
}

upstream php74 { server ecidade74_php74:80; }
upstream php85 { server ecidade74_php85:80; }

server {
    listen 80;
    server_name localhost;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    # $http_host preserva a PORTA; o e-cidade monta URLs absolutas a partir de HTTP_HOST.
    # Com $host o CSS/JS seriam pedidos na porta 80. Nao trocar por $host.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;

    location / {
        add_header X-Ecidade-Runtime $ecidade_runtime always;
        proxy_pass http://$ecidade_upstream;
    }
}
